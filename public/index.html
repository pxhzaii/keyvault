<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>KeyVault - 密码管理器</title>
<style>
:root{--bg:#f0f2f5;--bg2:#fff;--bg3:#e8ecf1;--bg4:#d5dbe3;--tx:#1a1a2e;--tx2:#5a6070;--tx3:#9aa0b0;--ac:#4f6ef7;--ac2:#3d5bd6;--ac-l:rgba(79,110,247,.08);--ac-l2:rgba(79,110,247,.15);--bd:#e2e6ed;--danger:#ef4444;--warn:#f59e0b;--ok:#22c55e;--shadow:0 1px 3px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.04);--shadow2:0 4px 24px rgba(0,0,0,.1);--radius:12px;--rs:8px;--font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,Arial,sans-serif;--t:all .2s cubic-bezier(.4,0,.2,1)}
.dark{--bg:#0c0c14;--bg2:#16162a;--bg3:#22223a;--bg4:#2e2e4a;--tx:#e4e4f0;--tx2:#9898b0;--tx3:#606080;--ac:#6c83f7;--ac2:#5a70e0;--ac-l:rgba(108,131,247,.1);--ac-l2:rgba(108,131,247,.18);--bd:#2a2a45;--shadow:0 1px 3px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.2);--shadow2:0 4px 24px rgba(0,0,0,.4)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--tx);line-height:1.5;overflow:hidden;height:100vh;transition:background .3s,color .3s}
button{cursor:pointer;font-family:var(--font);border:none;outline:none;transition:var(--t);background:none;color:inherit}
input,select,textarea{font-family:var(--font);outline:none;transition:border .2s}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}
.dark ::-webkit-scrollbar-thumb{background:var(--bg4)}

#gateScreen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:99999;transition:opacity .4s}
#gateScreen.hiding{opacity:0;pointer-events:none}
#lockScreen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:9999;transition:opacity .4s}
#lockScreen.hiding{opacity:0;pointer-events:none}
.lock-box{text-align:center;padding:48px 40px;background:var(--bg2);border-radius:20px;box-shadow:var(--shadow2);width:400px;max-width:92vw}
.lock-icon{font-size:56px;margin-bottom:8px}
.lock-box h1{font-size:26px;font-weight:800;letter-spacing:-.5px}
.lock-box .sub{color:var(--tx2);font-size:14px;margin-bottom:28px}
.lock-input{width:100%;padding:13px 18px;border:2px solid var(--bd);border-radius:var(--rs);font-size:15px;background:var(--bg);color:var(--tx);margin-bottom:10px}
.lock-input:focus{border-color:var(--ac)}
.lock-btn{width:100%;padding:13px;background:var(--ac);color:#fff;border-radius:var(--rs);font-size:15px;font-weight:600;margin-top:6px}
.lock-btn:hover{background:var(--ac2)}.lock-btn:active{transform:scale(.98)}
.lock-err{color:var(--danger);font-size:13px;margin-top:10px;min-height:20px}
.lock-hint{font-size:12px;color:var(--tx3);margin-top:16px;line-height:1.6}

#app{display:flex;flex-direction:column;height:100vh;opacity:0;transition:opacity .4s}#app.show{opacity:1}
.top-bar{display:flex;align-items:center;gap:10px;padding:12px 24px;background:var(--bg2);border-bottom:1px solid var(--bd);flex-shrink:0}
.top-bar .logo{font-size:22px}.top-bar h2{font-size:17px;font-weight:800;flex:1}
.top-bar-actions{display:flex;gap:6px;margin-left:auto;flex-shrink:0;position:relative}
.top-bar-actions button{padding:6px 10px;border-radius:var(--rs);font-size:12px;background:var(--bg3);color:var(--tx2);font-weight:500;cursor:pointer;border:none;transition:var(--t)}
.top-bar-actions button:hover{background:var(--ac-l2);color:var(--ac)}
.cat-bar{display:flex;align-items:center;gap:6px;padding:8px 24px;background:var(--bg2);border-bottom:1px solid var(--bd);flex-shrink:0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.cat-bar::-webkit-scrollbar{display:none}
.cat-tab{display:inline-flex;align-items:center;gap:5px;padding:6px 14px;border-radius:20px;cursor:pointer;color:var(--tx2);font-size:13px;font-weight:500;white-space:nowrap;transition:var(--t);border:1.5px solid transparent;flex-shrink:0}
.cat-tab:hover{background:var(--ac-l);color:var(--ac)}.cat-tab.active{background:var(--ac-l2);color:var(--ac);font-weight:600;border-color:var(--ac)}
.cat-tab .badge{background:var(--bg3);padding:1px 7px;border-radius:10px;font-size:11px;font-weight:600;color:var(--tx3);margin-left:2px}
.cat-tab.active .badge{background:var(--ac);color:#fff}
.cat-sep{width:1px;height:20px;background:var(--bd);margin:0 4px;flex-shrink:0}
.ec-check{width:22px;height:22px;border:2px solid var(--bd);border-radius:6px;cursor:pointer;flex-shrink:0;display:none;align-items:center;justify-content:center;font-size:13px;transition:var(--t)}.select-mode .ec-check{display:flex}.select-mode .ec{cursor:default}.ec-check.checked{background:var(--ac);border-color:var(--ac);color:#fff}
.batch-bar{display:none;align-items:center;gap:12px;padding:10px 24px;background:var(--bg2);border-top:1px solid var(--bd);flex-shrink:0}.batch-bar.show{display:flex}.batch-bar .batch-info{font-size:13px;color:var(--tx2);font-weight:600}.batch-bar .batch-info strong{color:var(--ac)}

/* Sync panel in top bar dropdown */
.sync-dropdown{position:relative;display:inline-block}
.sync-menu{display:none;position:fixed;right:0;top:100%;background:var(--bg2);border:1px solid var(--bd);border-radius:var(--radius);box-shadow:var(--shadow2);padding:12px;min-width:220px;z-index:100}
.sync-menu.show{display:block}

.mn{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.toolbar{padding:10px 24px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--bd);background:var(--bg2);flex-shrink:0}
.search{flex:1;max-width:420px;position:relative}
.search input{width:100%;padding:9px 14px 9px 38px;border:1.5px solid var(--bd);border-radius:var(--rs);background:var(--bg);color:var(--tx);font-size:13.5px}
.search input:focus{border-color:var(--ac)}
.search::before{content:"\1F50D";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:13px;opacity:.6}
.tb-actions{display:flex;gap:8px;margin-left:auto;flex-shrink:0}

.btn{padding:9px 18px;border-radius:var(--rs);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn-p{background:var(--ac);color:#fff}.btn-p:hover{background:var(--ac2)}
.btn-g{background:transparent;color:var(--tx2);border:1.5px solid var(--bd)}.btn-g:hover{border-color:var(--ac);color:var(--ac)}
.btn-d{background:var(--danger);color:#fff}
.btn-sm{padding:6px 12px;font-size:12px}

.ct{flex:1;overflow-y:auto;padding:24px}
.ct-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.ct-head h2{font-size:20px;font-weight:800;letter-spacing:-.3px}
.ct-head .meta{font-size:13px;color:var(--tx3)}

.el{display:flex;flex-direction:column;gap:6px}
.ec{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--bg2);border-radius:var(--radius);border:1.5px solid transparent;cursor:pointer;transition:var(--t)}
.ec:hover{border-color:var(--ac);box-shadow:0 2px 8px rgba(79,110,247,.08)}
.ec-icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.ec-info{flex:1;min-width:0}
.ec-name{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ec-sub{font-size:12.5px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.ec-acts{display:flex;gap:4px;opacity:0;transition:opacity .15s;flex-shrink:0}
.ec:hover .ec-acts{opacity:1}
.ec-acts button{width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;background:var(--bg3)}
.ec-acts button:hover{background:var(--ac-l2);color:var(--ac)}

.cat-other{background:var(--bg3);color:var(--tx2)}

.dv{max-width:640px;animation:fadeUp .3s}@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.dv-head{display:flex;align-items:center;gap:14px;margin-bottom:24px}
.dv-icon{width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.dv-title{font-size:20px;font-weight:800;letter-spacing:-.3px}
.dv-url{font-size:13px;color:var(--tx2)}
.dv-acts{margin-left:auto;display:flex;gap:6px}
.dv-sec{margin-bottom:20px}
.dv-sec h4{font-size:11px;text-transform:uppercase;color:var(--tx3);font-weight:700;letter-spacing:.6px;margin-bottom:8px}
.dv-row{display:flex;align-items:center;padding:10px 14px;background:var(--bg2);border:1px solid var(--bd);border-radius:var(--rs);margin-bottom:5px;gap:8px}
.dv-row .lb{font-size:12.5px;color:var(--tx2);width:90px;flex-shrink:0;font-weight:500}
.dv-row .vl{flex:1;font-size:14px;word-break:break-all;font-family:inherit}
.dv-row .vl.mono{font-family:monospace;letter-spacing:1px}
.dv-row .cp{width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;cursor:pointer}
.dv-row .cp:hover{background:var(--ac-l2);color:var(--ac)}
.totp-code{font-family:monospace;font-size:26px;font-weight:800;letter-spacing:4px;color:var(--ac)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.tag{display:inline-flex;padding:3px 10px;border-radius:14px;font-size:11.5px;background:var(--ac-l2);color:var(--ac);font-weight:500}

.mo{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;visibility:hidden;transition:all .25s}
.mo.show{opacity:1;visibility:visible}
.mo-box{background:var(--bg2);border-radius:16px;width:800px;max-width:100%;max-height:88vh;display:flex;flex-direction:column;box-shadow:var(--shadow2);transform:scale(.96) translateY(8px);transition:var(--t)}
.mo.show .mo-box{transform:none}
.mo-h{padding:18px 22px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.mo-h h3{font-size:17px;font-weight:700}
.mo-close{width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--tx2)}
.mo-close:hover{background:var(--bg3)}
.mo-b{padding:22px;overflow-y:auto;flex:1}
.mo-f{padding:14px 22px;border-top:1px solid var(--bd);display:flex;justify-content:flex-end;gap:8px;flex-shrink:0}

.fg{margin-bottom:14px}
.fl{display:block;font-size:12.5px;font-weight:600;color:var(--tx2);margin-bottom:5px}
.fi{width:100%;padding:9px 13px;border:1.5px solid var(--bd);border-radius:var(--rs);background:var(--bg);color:var(--tx);font-size:13.5px}
.fi:focus{border-color:var(--ac)}
textarea.fi{resize:vertical;min-height:60px}
.fr{display:flex;gap:10px}.fr>*{flex:1}
.fi-wrap{position:relative}.fi-wrap input{padding-right:72px}
.fi-wrap .eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:14px;cursor:pointer;padding:4px}
.fi-wrap .dice{position:absolute;right:34px;top:50%;transform:translateY(-50%);font-size:14px;cursor:pointer;padding:4px}
.fg-custom{border:1.5px solid var(--bd);border-radius:var(--rs);padding:10px;margin-bottom:8px;position:relative}
.fg-custom .rm{position:absolute;top:6px;right:8px;font-size:14px;color:var(--danger);cursor:pointer}
.str{height:3px;border-radius:2px;margin-top:4px;background:var(--bg3);overflow:hidden}
.str .fill{height:100%;border-radius:2px;transition:width .3s,background .3s}

.gen{background:var(--bg2);border:1.5px solid var(--bd);border-radius:var(--radius);padding:20px;max-width:520px}
.gen-out{display:flex;gap:8px;margin-bottom:16px}
.gen-out input{flex:1;padding:12px;font-family:monospace;font-size:17px;letter-spacing:1px;border:1.5px solid var(--bd);border-radius:var(--rs);background:var(--bg);color:var(--tx)}
.gen-opts{display:flex;flex-direction:column;gap:10px}
.gen-opts label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--tx2);cursor:pointer}
.gen-opts input[type="range"]{flex:1;accent-color:var(--ac)}
.gen-opts input[type="checkbox"]{width:16px;height:16px;accent-color:var(--ac)}

.stg-sec{margin-bottom:20px}
.stg-sec h3{font-size:15px;font-weight:700;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--bd)}
.stg-item{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bd)}
.stg-item:last-child{border-bottom:none}
.stg-info h4{font-size:13.5px;font-weight:600}
.stg-info p{font-size:12px;color:var(--tx3);margin-top:2px}
.acc-cards{display:flex;gap:12px;margin-bottom:16px}
.acc-card{flex:1;border:1.5px solid var(--bd);border-radius:var(--radius);background:var(--bg2);cursor:pointer;transition:var(--t);overflow:hidden}
.acc-card:hover{border-color:var(--ac);box-shadow:0 2px 8px rgba(79,110,247,.08)}
.acc-card.active{border-color:var(--ac)}
.acc-card-head{display:flex;align-items:center;gap:10px;padding:14px 16px}
.acc-card-head .icon{font-size:22px}
.acc-card-head .info{flex:1}
.acc-card-head .title{font-size:14px;font-weight:700}
.acc-card-head .desc{font-size:11.5px;color:var(--tx3);margin-top:1px}
.acc-card-head .arrow{font-size:12px;color:var(--tx3);transition:transform .2s}
.acc-card.active .acc-card-head .arrow{transform:rotate(180deg)}
.acc-card-body{max-height:0;overflow:hidden;transition:max-height .3s ease,padding .3s;padding:0 16px}
.acc-card.active .acc-card-body{max-height:600px;padding:0 16px 16px}
.toggle{position:relative;width:42px;height:24px;background:var(--bg3);border-radius:12px;cursor:pointer;transition:background .2s;flex-shrink:0}
.toggle.on{background:var(--ac)}
.toggle::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;left:3px;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.toggle.on::after{left:21px}
.wdav{background:var(--bg);border:1.5px solid var(--bd);border-radius:var(--radius);padding:16px;margin-top:6px}
.wdav .fg{margin-bottom:10px}.wdav .fi{font-size:13px;padding:8px 12px}
.wdav-status{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:var(--rs);font-size:13px;margin-top:8px;font-weight:500}
.wdav-status.ok{background:rgba(34,197,94,.1);color:#16a34a}
.wdav-status.err{background:rgba(239,68,68,.1);color:#ef4444}
.ie-area{border:2px dashed var(--bd);border-radius:var(--radius);padding:28px;text-align:center;cursor:pointer;transition:var(--t);margin-bottom:12px}
.ie-area:hover{border-color:var(--ac);background:var(--ac-l)}
.ie-area p{color:var(--tx2);font-size:14px}

.tc{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:6px}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;vertical-align:middle;margin-right:4px}
.dot.ok{background:var(--ok)}.dot.off{background:var(--tx3)}
.tt{padding:10px 18px;border-radius:var(--rs);font-size:13.5px;color:#fff;animation:slideR .3s;box-shadow:var(--shadow2);font-weight:500}
.tt-ok{background:#22c55e}.tt-err{background:#ef4444}.tt-info{background:var(--ac)}
@keyframes slideR{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}

.empty{text-align:center;padding:60px 20px;color:var(--tx3)}
.empty .icon{font-size:44px;margin-bottom:10px;opacity:.6}
.empty h3{color:var(--tx);font-size:17px;margin-bottom:6px;font-weight:700}
.empty p{font-size:14px;margin-bottom:16px}

@media(max-width:768px){
  .top-bar{padding:10px 14px;gap:8px;flex-wrap:wrap}
  .top-bar h2{font-size:15px}
  .cat-bar{padding:6px 14px;gap:4px}
  .cat-tab{padding:5px 10px;font-size:12px}
  .ct{padding:12px}.toolbar{padding:8px 14px;gap:8px;flex-wrap:wrap}
  .search{max-width:100%;order:1;flex-basis:100%}.mo-box{width:100%;max-height:100vh;border-radius:0;max-width:100%}
  .fr{flex-direction:column}.ec-acts{opacity:1}.dv-acts{flex-direction:column}
  .acc-cards{flex-direction:column}
  .mo-b{padding:14px}
  .wdav{padding:10px}
  .wdav .fi{font-size:12.5px;padding:7px 10px}
  .dv-row .lb{width:70px}
  .dv-head{flex-wrap:wrap}
  .dv-acts{margin-left:0;margin-top:8px}
  .lock-box{padding:32px 24px}
  .lock-icon{font-size:42px}
  .lock-box h1{font-size:22px}
  .batch-bar{flex-wrap:wrap;gap:8px!important}
}
</style>
</head>
<body>

<div id="gateScreen" style="display:none">
  <div class="lock-box">
    <div class="lock-icon">&#x1F6E1;</div>
    <h1>KeyVault</h1>
    <p class="sub">请输入访问密码</p>
    <input class="lock-input" type="password" id="gatePwdInput" placeholder="访问密码" autocomplete="off" autofocus>
    <button class="lock-btn" onclick="handleGate()">确认</button>
    <div class="lock-err" id="gateErr">&nbsp;</div>
  </div>
</div>

<div id="lockScreen">
  <div class="lock-box" id="welcomeBox" style="display:none">
    <div class="lock-icon">&#x1F512;</div>
    <h1>KeyVault</h1>
    <p class="sub">欢迎使用密码管理器</p>
    <p style="font-size:13px;color:var(--tx2);margin-bottom:20px;line-height:1.8">首次使用，请创建主密码。<br>此密码是保险库的唯一钥匙，<strong style="color:var(--danger)">丢失无法恢复</strong>。</p>
    <input class="lock-input" type="password" id="setupPwd" placeholder="输入主密码" autocomplete="off">
    <input class="lock-input" type="password" id="setupPwd2" placeholder="确认主密码" autocomplete="off">
    <button class="lock-btn" onclick="handleSetup()">创建保险库</button>
    <div class="lock-err" id="setupErr">&nbsp;</div>
    <div class="lock-hint" style="margin-top:18px;padding-top:14px;border-top:1px solid var(--bd)">已有主密码？<button style="color:var(--ac);font-weight:600;background:none;border:none;cursor:pointer;font-size:12px;padding:0 2px" onclick="switchToUnlock()">点击解锁</button></div>
  </div>
  <div class="lock-box" id="unlockBox" style="display:none">
    <div class="lock-icon">&#x1F513;</div>
    <h1>KeyVault</h1>
    <p class="sub">输入密码以解锁</p>
    <input class="lock-input" type="password" id="masterPwd" placeholder="主密码" autocomplete="off" autofocus>
    <button class="lock-btn" onclick="handleUnlock()">解锁</button>
    <div class="lock-err" id="lockErr">&nbsp;</div>
    <div class="lock-hint">忘记密码将无法恢复数据</div>
  </div>
</div>


<div id="app">
  <div class="top-bar">
    <span class="logo">&#x1F510;</span><h2>KeyVault</h2>
    <div class="top-bar-actions">
      <div class="sync-dropdown" id="syncDropdown">
        <button onclick="showSyncMenu(event)">&#x2601; 同步</button>
      </div>
      <button onclick="showSettings()">&#x2699; 设置</button>
      <button onclick="lockVault()">&#x1F512; 锁定</button>
    </div>
  </div>
  <div class="cat-bar" id="catBar"></div>
  <div class="mn">
    <div class="toolbar">
      <div class="search"><input id="searchInput" placeholder="搜索名称、用户名或地址..." oninput="filterEntries()"></div>
      <div class="tb-actions"><button class="btn btn-g btn-sm" id="manageBtn" onclick="toggleSelectMode()">多选</button><button class="btn btn-p" onclick="showAddEntry()">+ 新增</button></div>
    </div>
    <div class="batch-bar" id="batchBar">
      <div class="batch-info">已选 <strong id="batchCount">0</strong> 项</div>
      <button class="btn btn-g btn-sm" onclick="selectAllEntries()">全选</button>
      <button class="btn btn-g btn-sm" onclick="deselectAll()">取消全选</button>
      <button class="btn btn-d btn-sm" onclick="batchDelete()">&#x1F5D1; 删除所选</button>
      <button class="btn btn-g btn-sm" onclick="toggleSelectMode()" style="margin-left:auto">取消</button>
    </div>
    <div class="ct" id="content"></div>
  </div>
</div>

<div class="mo" id="mo">

/* ===== Derive Salt ===== */
async function deriveSalt(pwd){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('KeyVault-Salt:'+pwd));
  return new Uint8Array(buf);
}

/* ===== Base64 ===== */
function toB64(buf){let s='';for(let i=0;i<buf.length;i++)s+=String.fromCharCode(buf[i]);return btoa(s)}
function fromB64(b64){const bin=atob(b64);const buf=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)buf[i]=bin.charCodeAt(i);return buf}

/* ===== Crypto ===== */
async function deriveKey(pwd){
  if(!SALT)SALT=await deriveSalt(pwd);
  const raw=await crypto.subtle.importKey('raw',new TextEncoder().encode(pwd),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:SALT,iterations:600000,hash:'SHA-256'},raw,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function deriveApiToken(pwd){
  if(!SALT)SALT=await deriveSalt(pwd);
  const raw=await crypto.subtle.importKey('raw',new TextEncoder().encode(pwd),'PBKDF2',false,['deriveKey']);
  const tokenSalt=new Uint8Array([...SALT,84,111,107,101,110]);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:tokenSalt,iterations:100000,hash:'SHA-256'},raw,{name:'HMAC',hash:'SHA-256'},true,['sign']);
  const sig=await crypto.subtle.sign('HMAC',key,new TextEncoder().encode('keyvault-api-token'));
  return toB64(new Uint8Array(sig)).replace(/[+/=]/g,'').slice(0,32);
}
async function enc(data,key){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(data)));
  const buf=new Uint8Array(iv.length+ct.byteLength);buf.set(iv);buf.set(new Uint8Array(ct),iv.length);
  return toB64(buf);
}
async function dec(b64,key){
  const buf=fromB64(b64);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:buf.slice(0,12)},key,buf.slice(12));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function sha256(s){const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return toB64(new Uint8Array(buf))}

/* ===== IndexedDB ===== */
function openDB(){return new Promise((ok,no)=>{const r=indexedDB.open(DB,VER);r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains(ST))d.createObjectStore(ST,{keyPath:'id'});if(!d.objectStoreNames.contains(CF))d.createObjectStore(CF,{keyPath:'k'});};r.onsuccess=e=>{db=e.target.result;ok(db)};r.onerror=e=>no(e)})}
function idbOp(store,mode,fn){return new Promise((ok,no)=>{const tx=db.transaction(store,mode);const s=tx.objectStore(store);const r=fn(s);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
const idbGet=(s,k)=>idbOp(s,'readonly',st=>st.get(k));
const idbPut=(s,v)=>idbOp(s,'readwrite',st=>st.put(v));
const idbDel=(s,k)=>idbOp(s,'readwrite',st=>st.delete(k));
const idbAll=s=>idbOp(s,'readonly',st=>st.getAll());

async function saveEntry(e){await idbPut(ST,{id:e.id,data:await enc(e,mk),cat:e.category||'other',del:!!e.deleted,delAt:e.deletedAt||null})}
async function loadEntries(){const all=await idbAll(ST);entries=[];for(const item of all){try{const e=await dec(item.data,mk);e._del=!!item.del;e._delAt=item.delAt;entries.push(e)}catch(err){}}}

async function updateEntry(id,d){const i=entries.findIndex(e=>e.id===id);if(i<0)return null;const old=entries[i];if(d.password&&d.password!==old.password&&old.password){const h=[...(old.passwordHistory||[])];h.push({password:old.password,changedAt:Date.now()});if(h.length>10)h.shift();d.passwordHistory=h}const e={...old,...d,updatedAt:Date.now()};await saveEntry(e);entries[i]=e;return e}
async function softDel(id){const i=entries.findIndex(e=>e.id===id);if(i<0)return;entries[i].deleted=true;entries[i].deletedAt=Date.now();await saveEntry(entries[i])}
async function restoreEntry(id){const i=entries.findIndex(e=>e.id===id);if(i<0)return;entries[i].deleted=false;entries[i].deletedAt=null;await saveEntry(entries[i])}
async function hardDel(id){entries=entries.filter(e=>e.id!==id);await idbDel(ST,id)}

async function kvPush(){
  if(!requireOnline())return;
  if(!cfg.apiBase||!apiToken)return toast('请配置云端同步','err');
  toast('推送到 KV...','info');
  try{
    // 推送前校验：尝试读取云端数据并用当前主密码解密
    // 如果解密失败说明主密码不一致，拒绝覆盖
    try{
      const head=await fetch(cfg.apiBase+'/api/vault',{headers:{'Authorization':'Bearer '+apiToken}});
      if(head.ok){
        const hj=await head.json();
        if(hj.data!=null&&hj.data!==''){
          try{await dec(hj.data,mk)}catch(e){
            toast('推送失败：云端数据由其他主密码加密，当前密码无法解密。如需覆盖请先清除云端数据','err');return;
          }
        }
      }
    }catch(e){}
    let remoteVersion=vaultVersion;
    try{
      const head=await fetch(cfg.apiBase+'/api/vault',{method:'GET',headers:{'Authorization':'Bearer '+apiToken}});
      if(head.ok){const hj=await head.json();if(hj.version>remoteVersion)remoteVersion=hj.version}
    }catch(e){}
    vaultVersion=Math.max(vaultVersion,remoteVersion)+1;
    const all=entries.filter(e=>!e.deleted);
    const customCats=CATS.filter(c=>c.id!=='all');
    const vaultData=await enc({entries:all,version:vaultVersion,updatedAt:Date.now(),device:navigator.userAgent.slice(0,50),customCats},mk);
    let res=await fetch(cfg.apiBase+'/api/vault',{method:'PUT',headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiToken},body:JSON.stringify({data:vaultData,version:vaultVersion})});
    if(res.status===401){await initKvToken();res=await fetch(cfg.apiBase+'/api/vault',{method:'PUT',headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiToken},body:JSON.stringify({data:vaultData,version:vaultVersion})})}
    if(!res.ok)throw new Error(await res.text());
    toast('KV 推送成功','ok');updateSyncStatusUI();await idbPut(CF,{k:'vaultVersion',v:vaultVersion});
  }catch(e){toast('KV 推送失败: '+e.message,'err');updateSyncStatusUI()}
}
async function kvPull(){
  if(!requireOnline())return;
  if(!cfg.apiBase||!apiToken)return toast('请配置云端同步','err');
  if(!confirm('恢复将用云端数据完全覆盖本地数据，本地新增且未同步的记录将丢失，确认？'))return;

  try{
    let res=await fetch(cfg.apiBase+'/api/vault',{headers:{'Authorization':'Bearer '+apiToken}});
    if(res.status===401){await initKvToken();res=await fetch(cfg.apiBase+'/api/vault',{headers:{'Authorization':'Bearer '+apiToken}})}
    if(res.status===404){toast('云端暂无数据','info');return}
    if(!res.ok)throw new Error(await res.text());
    const {data,version}=await res.json();
    let remote;
    try{
      remote=await dec(data,mk);
    }catch(e){
      toast('恢复失败: 无法解密云端数据。请确认密码一致','err');
      return;
    }
    if(!remote.entries||!Array.isArray(remote.entries))throw new Error('格式无效');

    if(remote.customCats&&Array.isArray(remote.customCats)){

    await new Promise((ok,no)=>{const tx=db.transaction(ST,'readwrite');tx.objectStore(ST).clear();tx.oncomplete=ok;tx.onerror=()=>no(tx.error)});

/* ===== WebDAV ===== */
async function wdavReq(method,path,body=null,rawBody=false){
  if(!cfg.wdavUrl)return toast('请配置 WebDAV','err'),Promise.reject(new Error('未配置 WebDAV'));
  const targetUrl=cfg.wdavUrl.replace(/\/$/,'')+path;
  const h={};if(body)h['Content-Type']=rawBody?'application/octet-stream':'application/json';
  if(cfg.wdavUser)h['Authorization']='Basic '+btoa(unescape(encodeURIComponent(cfg.wdavUser+':'+cfg.wdavPass)));
  let proxyUrl;
  const useVercel=!!cfg.wdavProxy;
  if(cfg.wdavProxy){
    proxyUrl=cfg.wdavProxy.replace(/\/$/,'')+'?method='+encodeURIComponent(method)+'&url='+encodeURIComponent(targetUrl);
  }else if(cfg.apiBase){
    proxyUrl=cfg.apiBase+'/api/webdav-proxy?method='+encodeURIComponent(method)+'&url='+encodeURIComponent(targetUrl);
    if(apiToken)h['X-Api-Token']=apiToken;
  }else{
    toast('请配置 WebDAV 代理地址或 KV API 地址','err');return Promise.reject(new Error('未配置代理'));
  }
  const opts={method:'POST',headers:h,mode:'cors'};
  if(body)opts.body=rawBody?body:JSON.stringify(body);
  const res=await fetch(proxyUrl,opts);
  if(useVercel){
    const json=await res.json();
    const status=json.status||res.status;
    if(status>=400){
      const errMsg=json.error||`WebDAV ${method}: ${status}`;
      throw new Error(errMsg);
    }
    let bodyText='';
    if(json.bodyB64){
      bodyText=atob(json.bodyB64);
    }
    return {status,bodyText};
  }else{
    if(!res.ok)throw new Error(`WebDAV ${method}: ${res.status}`);
    const bodyText=await res.text();
    return {status:res.status,bodyText};
  }
}

/* ===== Password Generator ===== */
const PW_C={upper:'ABCDEFGHIJKLMNOPQRSTUVWXYZ',lower:'abcdefghijklmnopqrstuvwxyz',digits:'0123456789',symbols:'!@#$%^&*()_+-=[]{}|;:,.<>?'};
function genPwd(len=20,o={upper:true,lower:true,digits:true,symbols:true}){let cs='';if(o.upper)cs+=PW_C.upper;if(o.lower)cs+=PW_C.lower;if(o.digits)cs+=PW_C.digits;if(o.symbols)cs+=PW_C.symbols;if(!cs)cs=PW_C.lower;const limit=256-256%cs.length;let pw='';const rnd=crypto.getRandomValues(new Uint8Array(len*2));let ri=0;while(pw.length<len){if(ri>=rnd.length)break;const v=rnd[ri++];if(v<limit)pw+=cs[v%cs.length]}return pw}
function strength(pw){if(!pw)return{s:0,l:'',c:''};let s=0;if(pw.length>=8)s++;if(pw.length>=12)s++;if(pw.length>=16)s++;if(pw.length>=20)s++;if(/[a-z]/.test(pw))s++;if(/[A-Z]/.test(pw))s++;if(/[0-9]/.test(pw))s++;if(/[^a-zA-Z0-9]/.test(pw))s++;const m=[{s:0,l:'',c:''},{s:1,l:'极弱',c:'#ef4444'},{s:2,l:'弱',c:'#f97316'},{s:3,l:'一般',c:'#f59e0b'},{s:4,l:'中等',c:'#eab308'},{s:5,l:'强',c:'#84cc16'},{s:6,l:'很强',c:'#22c55e'},{s:7,l:'极强',c:'#10b981'},{s:8,l:'极强',c:'#059669'}];const r=Math.min(s,8);return{s:r,l:m[r].l,c:m[r].c}}

/* ===== TOTP ===== */
function b32dec(s){s=s.replace(/\s/g,'').toUpperCase();const c='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';let b='',by=[];for(const ch of s){const i=c.indexOf(ch);if(i<0)continue;b+=i.toString(2).padStart(5,'0')}for(let i=0;i+8<=b.length;i+=8)by.push(parseInt(b.substr(i,8),2));return new Uint8Array(by)}
async function genTOTP(secret){try{const key=b32dec(secret),epoch=Math.floor(Date.now()/1000),t=Math.floor(epoch/30);const buf=new ArrayBuffer(8);new DataView(buf).setBigUint64(0,BigInt(t),false);const k=await crypto.subtle.importKey('raw',key,{name:'HMAC',hash:'SHA-1'},false,['sign']);const sig=await crypto.subtle.sign('HMAC',k,buf);const dv=new DataView(sig),off=dv.getUint8(sig.byteLength-1)&0xf;const code=((dv.getUint8(off)&0x7f)<<24|(dv.getUint8(off+1)&0xff)<<16|(dv.getUint8(off+2)&0xff)<<8|(dv.getUint8(off+3)&0xff))%1000000;return String(code).padStart(6,'0')}catch(e){return'------'}}

/* ===== Brute-force Protection ===== */
function getLockDelay(){return Math.min(2**failCount*1000,86400000)}
function formatDelay(ms){
  if(ms<60000)return Math.ceil(ms/1000)+'秒';
  if(ms<3600000)return Math.ceil(ms/60000)+'分钟';
  return Math.ceil(ms/3600000)+'小时';
}
function updateLockUI(){
  const now=Date.now();
  if(now<lockUntil){
    const remaining=lockUntil-now;
    document.getElementById('lockErr').textContent=`密码错误次数过多，请等待 ${formatDelay(remaining)} 后重试`;
    document.getElementById('masterPwd').disabled=true;
    clearTimeout(lockdownTimer);
    lockdownTimer=setTimeout(updateLockUI,1000);
  }else{
    document.getElementById('masterPwd').disabled=false;
    document.getElementById('lockErr').innerHTML='&nbsp;';
  }
}

/* ===== Setup ===== */
async function handleSetup(){
  loadCfg();
  const pwd=document.getElementById('setupPwd').value;
  const pwd2=document.getElementById('setupPwd2').value;
  const err=document.getElementById('setupErr');
  if(!pwd){err.textContent='请输入主密码';return}
  if(pwd.length<4){err.textContent='密码至少4位';return}
  if(pwd!==pwd2){err.textContent='两次输入不一致';return}
  try{
    SALT=await deriveSalt(pwd);mk=await deriveKey(pwd);apiToken=await deriveApiToken(pwd);curPwd=pwd;
    const h=await sha256(pwd+Array.from(SALT).join(','));const th=await sha256(apiToken);
    await idbPut(CF,{k:'vaultHash',v:h});await idbPut(CF,{k:'created',v:Date.now()});await idbPut(CF,{k:'tokenHash',v:th});
    if(cfg.apiBase){try{const th2=await sha256(apiToken);const initH={'Content-Type':'application/json'};if(apiToken)initH['Authorization']='Bearer '+apiToken;await fetch(cfg.apiBase+'/api/init',{method:'POST',headers:initH,body:JSON.stringify({tokenHash:th2})})}catch(e){}}
    failCount=0;lockUntil=0;
    await initKvToken();
    await loadEntries();const vData=await idbGet(CF,'vaultVersion');if(vData)vaultVersion=vData.v||0;
    if(cfg.apiBase){try{await kvPull()}catch(e){}}
    document.getElementById('lockScreen').classList.add('hiding');
    setTimeout(()=>{document.getElementById('lockScreen').style.display='none'},400);
    const app=document.getElementById('app');app.style.display='flex';setTimeout(()=>app.classList.add('show'),10);
    await loadCustomCats();resetLock();detectNetwork();renderCatBar();render();renderSyncPanel();
    toast('保险库创建成功','ok');keepPwd(pwd);
  }catch(e){err.textContent='创建失败';mk=null;apiToken=null}
}

/* ===== Lock/Unlock ===== */
async function handleUnlock(){
  loadCfg();
  const pwd=document.getElementById('masterPwd').value;if(!pwd)return;
  const now=Date.now();
  if(now<lockUntil){
    const remaining=lockUntil-now;
    document.getElementById('lockErr').textContent=`密码错误次数过多，请等待 ${formatDelay(remaining)} 后重试`;
    return;
  }
  const err=document.getElementById('lockErr');
  try{
    SALT=await deriveSalt(pwd);mk=await deriveKey(pwd);apiToken=await deriveApiToken(pwd);curPwd=pwd;
    const h=await sha256(pwd+Array.from(SALT).join(','));const stored=await idbGet(CF,'vaultHash');
    if(!stored||h!==stored.v){
      const oldSaltData=await idbGet(CF,'deviceSalt');
      if(oldSaltData&&oldSaltData.v){
        const oldArr=[];for(const c of oldSaltData.v)oldArr.push(c);
        const oldSalt=new Uint8Array(oldArr);
        const oldH=await sha256(pwd+Array.from(oldSalt).join(','));
        if(oldH===stored.v){
          toast('正在迁移加密方式...','info');
          const oldRaw=await crypto.subtle.importKey('raw',new TextEncoder().encode(pwd),'PBKDF2',false,['deriveKey']);
          const oldMk=await crypto.subtle.deriveKey({name:'PBKDF2',salt:oldSalt,iterations:600000,hash:'SHA-256'},oldRaw,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
          const allItems=await idbAll(ST);
          const migrated=[];
          for(const item of allItems){
            try{
              const e=await dec(item.data,oldMk);
              migrated.push({item,e});
            }catch(e){}
          }
          SALT=await deriveSalt(pwd);
          mk=await deriveKey(pwd);
          apiToken=await deriveApiToken(pwd);
          for(const {item,e} of migrated){
            const newData=await enc(e,mk);
            await idbPut(ST,{id:item.id,data:newData,cat:item.cat,del:item.del,delAt:item.delAt});
          }
          const newH=await sha256(pwd+Array.from(SALT).join(','));
          const newTh=await sha256(apiToken);
          await idbPut(CF,{k:'vaultHash',v:newH});
          await idbPut(CF,{k:'tokenHash',v:newTh});
          await idbPut(CF,{k:'deviceSalt',v:null});
          toast('迁移完成！加密方式已升级，请重新登录','ok');
        }else{
          failCount++;const delay=getLockDelay();lockUntil=now+delay;
          err.textContent=`密码错误（第${failCount}次），请等待 ${formatDelay(delay)} 后重试`;
          document.getElementById('masterPwd').disabled=true;
          clearTimeout(lockdownTimer);lockdownTimer=setTimeout(updateLockUI,1000);
          mk=null;apiToken=null;SALT=null;return
        }
      }else{
          failCount++;const delay=getLockDelay();lockUntil=now+delay;
          err.textContent=`密码错误（第${failCount}次），请等待 ${formatDelay(delay)} 后重试`;
          document.getElementById('masterPwd').disabled=true;
          clearTimeout(lockdownTimer);lockdownTimer=setTimeout(updateLockUI,1000);
          mk=null;apiToken=null;SALT=null;return
        }
    }
    failCount=0;lockUntil=0;clearTimeout(lockdownTimer);
    await initKvToken();
    await loadEntries();const vData=await idbGet(CF,'vaultVersion');if(vData)vaultVersion=vData.v||0;
    clearKeptPwdAfterUse();
    document.getElementById('lockScreen').classList.add('hiding');
    setTimeout(()=>{document.getElementById('lockScreen').style.display='none'},400);
    const app=document.getElementById('app');app.style.display='flex';setTimeout(()=>app.classList.add('show'),10);
    await loadCustomCats();resetLock();detectNetwork();renderCatBar();render();showBackupReminder();keepPwd(pwd);renderSyncPanel()
  }catch(e){err.textContent='解锁失败';mk=null;apiToken=null}
}

/* ===== Network Detection ===== */
let networkListenersAdded=false;
function detectNetwork(){
  isOffline=!navigator.onLine;
  updateOfflineBanner();
  if(networkListenersAdded)return;networkListenersAdded=true;
  window.addEventListener('online',()=>{isOffline=false;updateOfflineBanner();toast('网络已恢复','ok')});
  window.addEventListener('offline',()=>{isOffline=true;updateOfflineBanner();toast('网络已断开，已进入离线模式','err')});
}
function updateOfflineBanner(){
  let banner=document.getElementById('offlineBanner');
  if(isOffline){
    if(!banner){
      banner=document.createElement('div');
      banner.id='offlineBanner';
      banner.style.cssText='position:fixed;top:0;left:0;right:0;z-index:9998;background:var(--warn);color:#fff;text-align:center;padding:8px;font-size:13px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.15)';
      banner.innerHTML='&#x26A0; 网络已断开 - 当前为离线模式，新增/编辑/删除/同步等操作已禁用';
      document.body.appendChild(banner);
    }
  }else if(banner){
    banner.remove();
  }
}
function requireOnline(){
  if(isOffline){toast('离线模式无法执行此操作','err');return false}
  return true;
}

function updateBatchCount(){const el=document.getElementById('batchCount');if(el)el.textContent=selectedIds.size}
async function batchDelete(){
  if(!requireOnline())return;
  if(selectedIds.size===0)return toast('请选择项目','err');
  const count=selectedIds.size;

function saveAllSettings(){cfg.apiBase=(document.getElementById('apiBase')?.value.trim()||cfg.apiBase).replace(/\/+$/,'');cfg.wdavUrl=document.getElementById('wUrl')?.value.trim()||cfg.wdavUrl;cfg.wdavUser=document.getElementById('wUser')?.value.trim()||cfg.wdavUser;cfg.wdavPass=document.getElementById('wPass')?.value||cfg.wdavPass;cfg.wdavPath=document.getElementById('wPath')?.value.trim()||'/KeyVault/';cfg.wdavProxy=document.getElementById('wdavProxy')?.value.trim()||'';saveCfg();toast('设置已保存','ok');renderCatBar();renderSyncPanel();initKvToken().catch(()=>{})}
async function testWdav(){saveAllSettings();const s=document.getElementById('wStatus');s.innerHTML='<div class="wdav-status" style="background:var(--bg3);color:var(--tx2)">测试中...</div>';try{
  await wdavTest();s.innerHTML='<div class="wdav-status ok">&#x2713; 连接成功</div>'
}catch(e){s.innerHTML=`<div class="wdav-status err">&#x2717; ${esc(e.message)}</div>`}}

/* ===== Modal ===== */
let _editDirty=false;
function openMo(){_editDirty=false;document.getElementById('mo').classList.add('show')}
function closeMo(){if(_editDirty){if(!confirm('有未保存的修改，确认关闭？'))return}_editDirty=false;document.getElementById('mo').classList.remove('show')}

/* ===== Escape ===== */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function escA(s){return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;').replace(/\r/g,'').replace(/\n/g,'\\n')}

/* ===== Init ===== */
(async function(){await openDB();loadCfg();let gateRequired=false;if(cfg.apiBase){try{gateRequired=await gateCheckEnabled()}catch(e){}}if(gateRequired&&!gatePassed&&!sessionStorage.getItem('kv_gate')){document.getElementById('gateScreen').style.display='flex';document.getElementById('gatePwdInput').addEventListener('keydown',e=>{if(e.key==='Enter')handleGate()})}else{document.getElementById('gateScreen').style.display='none'}const hash=await idbGet(CF,'vaultHash');if(hash){document.getElementById('welcomeBox').style.display='none';document.getElementById('unlockBox').style.display='block'}else{document.getElementById('welcomeBox').style.display='block';document.getElementById('unlockBox').style.display='none'}document.getElementById('masterPwd').addEventListener('keydown',e=>{if(e.key==='Enter')handleUnlock()});document.getElementById('setupPwd').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('setupPwd2').focus()});document.getElementById('setupPwd2').addEventListener('keydown',e=>{if(e.key==='Enter')handleSetup()});if(window.matchMedia?.('(prefers-color-scheme:dark)').matches&&!localStorage.getItem('kv_cfg'))cfg.dark=true;document.getElementById('app').style.display='none';
const savedPwd=cfg.keepUnlocked?getKeptPwd():null;if(savedPwd&&hash){document.getElementById('masterPwd').value=savedPwd;await handleUnlock()}})();
</script>
